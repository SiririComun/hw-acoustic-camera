name: Hardware Candidate Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: hardware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged packaging commit and complete source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source equivalence, review and artifact hashes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/validate_release.py \
            --tag "$RELEASE_TAG" --output-dir "$RUNNER_TEMP/release-assets"

      - name: Publish new candidate without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --prerelease --latest=false \
            --title "Acoustic camera HW $RELEASE_TAG — XADC reference" \
            --notes-file docs/RELEASE_NOTES.md \
            "$RUNNER_TEMP/release-assets/pynq_z2.bit" \
            "$RUNNER_TEMP/release-assets/pynq_z2.hwh" \
            "$RUNNER_TEMP/release-assets/build-manifest.json" \
            "$RUNNER_TEMP/release-assets/implementation-review.json" \
            "$RUNNER_TEMP/release-assets/SHA256SUMS.txt"

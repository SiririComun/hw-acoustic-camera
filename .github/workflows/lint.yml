name: RTL Syntax & Lint Verification

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'phase/**'
  pull_request:
    branches:
      - main

jobs:
  vhdl-lint:
    name: Fast-Fail VHDL Syntax Check (GHDL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install GHDL Analyzer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghdl

      - name: Run VHDL-93 Syntax Check
        run: |
          echo "========================================================"
          echo " Running Fast-Fail VHDL Syntax Check on Custom RTL Cores"
          echo "========================================================"
          
          # -C allows UTF-8 / non-ASCII characters in comments (bullets, arrows, etc.)
          ghdl -s --std=93 -C --ieee=synopsys -fexplicit src/hdl/tlast_generator.vhd
          ghdl -s --std=93 -C --ieee=synopsys -fexplicit src/hdl/axis_trigger_unit.vhd
          ghdl -s --std=93 -C --ieee=synopsys -fexplicit src/hdl/axis_decimator.vhd
          ghdl -s --std=93 -C --ieee=synopsys -fexplicit src/hdl/axis_channel_demux.vhd
          ghdl -s --std=93 -C --ieee=synopsys -fexplicit src/hdl/axis_spectral_mask.vhd
          
          echo "✅ All custom VHDL RTL cores passed syntax verification cleanly!"
